{% extends 'base.html' %}{% block body %}
<div class="card"><h1>Complete your profile</h1>
<p class="muted">You can update these details later from your dashboard.</p>
<form method="post" onsubmit="var e=this.elements;return confirm('Please confirm your details:\n\nName: '+e.full_name.value+'\nStation: '+e.station.value+'\nDesignation: '+e.designation.value+'\nDepartment: '+e.department.value)">
<input type="hidden" name="csrf" value="{{ csrf() }}">
<input name="full_name" placeholder="Full name" required maxlength="80">
<input name="mobile" placeholder="Mobile number (10 digits)" required inputmode="numeric">
<input name="station" data-picker="stations" required placeholder="Current station: type to search" autocomplete="off">
<datalist id="stations">{% for s in stations %}<option value="{{ s.name }}">{% endfor %}</datalist>
<select name="designation" required><option value="">Designation</option>{% for d in designations %}<option>{{ d.name }}</option>{% endfor %}</select>
<select name="department" required><option value="">Department</option>{% for d in departments %}<option>{{ d.name }}</option>{% endfor %}</select>
<button>Save profile</button></form></div>{% endblock %}
